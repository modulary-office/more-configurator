<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column like a clipboard sheet – header, rooms with item cards, send bar pinned to the bottom. */
:root{
  --paper:#FBFAF6; --sheet:#FFFFFF; --ink:#1C1C1A; --muted:#6B675F; --line:#D9D4C8; --dash:#B9B2A3;
  --yellow:#F8DC55; --yellow-ink:#1C1C1A; --chip:#F2EFE6; --ok:#2F7D4F; --warn:#B5651D; --err:#B3261E;
  --f-body:"Heebo",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#151513;--sheet:#1E1D1A;--ink:#F1EEE6;--muted:#A8A396;--line:#3A3832;--dash:#56524A;--chip:#2A2924;--yellow:#F3D64E;--ok:#6CC08F;--warn:#E3A35D;--err:#F08A80;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#151513;--sheet:#1E1D1A;--ink:#F1EEE6;--muted:#A8A396;--line:#3A3832;--dash:#56524A;--chip:#2A2924;--yellow:#F3D64E;--ok:#6CC08F;--warn:#E3A35D;--err:#F08A80;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;direction:rtl}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px;display:grid;gap:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-weight:800;letter-spacing:.14em;font-size:20px}
.brand span{font-size:13px;color:var(--muted)}
h1{font-size:26px;font-weight:800;margin:0;text-wrap:balance}
.tabs{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;color:var(--ink);font:500 14px var(--f-body);padding:7px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sheet{background:var(--sheet);border:1.5px dashed var(--dash);border-radius:var(--r);padding:16px;display:grid;gap:14px}
.sheet h2{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.sheet h2 .num{font-family:var(--f-mono);font-size:12px;background:var(--yellow);color:var(--yellow-ink);padding:1px 7px;border-radius:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px}
.f{display:grid;gap:4px;min-width:0;align-content:start}
.f>label,.lbl{font-size:12.5px;color:var(--muted);font-weight:500;letter-spacing:.01em}
.f.wide{grid-column:1/-1}
input[type=text],input[type=number],input[type=tel],input[type=date],textarea,select{width:100%;font:15px var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
textarea{min-height:64px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
input[type=number]{font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:500 14px var(--f-body);padding:6px 11px;border-radius:999px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.yn{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;min-height:36px}
.yn input{width:20px;height:20px;accent-color:var(--ink)}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.frames button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 4px 4px;cursor:pointer;display:grid;justify-items:center;gap:2px;color:var(--ink);font:500 12.5px var(--f-body)}
.frames button svg{width:58px;height:36px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.frames button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--yellow);color:var(--yellow-ink)}
.room{border:1.5px solid var(--ink);border-radius:var(--r);background:var(--sheet);overflow:hidden}
.room>.rh{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--ink);color:var(--paper)}
.room>.rh input{background:transparent;border:0;border-bottom:1px dashed color-mix(in srgb,var(--paper) 50%,transparent);color:var(--paper);font:700 16px var(--f-body);min-height:32px;padding:2px 0;flex:1;min-width:0}
.room>.rb{padding:12px;display:grid;gap:12px}
.iconbtn{border:0;background:transparent;color:inherit;cursor:pointer;font:500 13px var(--f-body);padding:6px 8px;border-radius:6px}
.iconbtn:hover{background:color-mix(in srgb,currentColor 12%,transparent)}
.item{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:12px;background:var(--paper)}
.item .ih{display:flex;align-items:center;gap:10px;justify-content:space-between}
.item .ih strong{font-size:15.5px;display:flex;align-items:center;gap:8px}
.item .ih strong svg{width:34px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:700 18px var(--f-body);cursor:pointer}
.qty output{min-width:28px;text-align:center;font:700 16px var(--f-mono)}
.sub{border-top:1px dashed var(--dash);padding-top:10px;display:grid;gap:10px}
.sub>.lbl{font-weight:700;color:var(--ink);font-size:13px}
.preview{font:500 12.5px/1.6 var(--f-body);background:var(--chip);border-radius:8px;padding:8px 10px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.preview::before{content:"בהזמנה לספק: ";color:var(--muted)}
.addgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.addgrid button{border:1px dashed var(--dash);background:var(--paper);color:var(--ink);border-radius:var(--r);padding:10px 6px;display:grid;justify-items:center;gap:4px;font:500 13px var(--f-body);cursor:pointer;min-height:76px}
.addgrid button svg{width:42px;height:28px;stroke:currentColor;fill:none;stroke-width:2}
.addgrid button:hover{border-style:solid;border-color:var(--ink)}
.photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.photos img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.photos label.add{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--dash);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13.5px}
.photos input{position:absolute;width:1px;height:1px;opacity:0}
.btn{border:0;border-radius:999px;font:700 15px var(--f-body);padding:11px 18px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--yellow);color:var(--yellow-ink)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--paper)}
.sendbar{position:fixed;inset:auto 0 0 0;background:var(--sheet);border-top:1.5px solid var(--ink);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:5}
.sendbar .sum{font-size:13px;color:var(--muted);min-width:0}
.sendbar .sum b{color:var(--ink);font-family:var(--f-mono)}
.note{font-size:13px;color:var(--muted)}
.status{font-size:13.5px;padding:8px 12px;border-radius:8px;background:var(--chip)}
.status.ok{color:var(--ok)} .status.err{color:var(--err)} .status.warn{color:var(--warn)}
.list{display:grid;gap:10px}
.order{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--sheet);display:grid;gap:6px}
.order .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--yellow);color:var(--yellow-ink)}
.pill.done{background:var(--chip);color:var(--muted)}
details.lines summary{cursor:pointer;font-size:13px;color:var(--muted)}
.empty{border:1.5px dashed var(--dash);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted)}
@media (max-width:520px){h1{font-size:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="mdy-app">
  <header class="top">
    <div>
      <div class="brand"><b>MODULARY</b><span>טופס פנימי לצוות</span></div>
      <h1>טופס הזמנה – מדידה אצל לקוח</h1>
    </div>

  </header>

  <main id="view-new" class="wrap" style="padding:0;gap:16px">
    <section class="sheet" aria-labelledby="h-cust">
      <h2 id="h-cust"><span class="num">1</span>לקוח ואתר</h2>
      <div id="hdr"></div>
    </section>

    <section class="sheet" aria-labelledby="h-rooms">
      <h2 id="h-rooms"><span class="num">2</span>חדרים ופריטים</h2>
      <p class="note">לכל חדר מוסיפים פריטים. המידות בס״מ. גוונים: אפשר לבחור מהרשימה או לכתוב קוד ספק.</p>
      <div id="rooms" class="list"></div>
      <button class="btn dark" id="addRoom" type="button">+ חדר</button>
    </section>

    <section class="sheet" aria-labelledby="h-gen">
      <h2 id="h-gen"><span class="num">3</span>הערות, שרטוטים ותמונות</h2>
      <div class="f wide"><label for="genNotes">הערות כלליות</label><textarea id="genNotes" placeholder="למשל: הכל בגוון של ההזמנה הקודמת, לתאם הרכבה אחרי 16:00"></textarea></div>
      <div class="photos" id="genPhotos"></div>
    </section>
  </main>

</div>

<div class="sendbar" id="sendbar">
  <div class="sum" id="sum">אין פריטים עדיין</div>
  <div style="display:flex;gap:8px">
    <button class="btn ghost" id="clearBtn" type="button">טופס חדש</button>
    <button class="btn primary" id="sendBtn" type="button">שליחה למודולרי</button>
  </div>
</div>

const FILES=new Map();   // name -> File
async function shrink(f){ if(!f.type.startsWith('image/')||f.size<1.2e6)return f;
  try{const bm=await createImageBitmap(f);const k=Math.min(1,2000/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));return new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'})}catch(e){return f}}
function photoBox(list,label='תמונה / שרטוט'){
  const box=h('div',{class:'photos'});const id=nid('ph');
  const inp=h('input',{type:'file',accept:'image/*,application/pdf',id,multiple:true});
  const draw=()=>{box.replaceChildren(...list.map(p=>FILES.has(p.name)?h('img',{src:p.url,alt:'תמונה מצורפת'}):h('span',{class:'note'},'📎 '+p.name+' (לצרף שוב)')),h('label',{class:'add',for:id},'+ '+label,inp))};
  inp.onchange=async()=>{for(const f0 of inp.files){const f=await shrink(f0);const name=`p${Date.now().toString(36)}${Math.random().toString(36).slice(2,5)}-${f.name}`.replace(/[^\w.\-]/g,'_');FILES.set(name,new File([f],name,{type:f.type}));list.push({name,url:URL.createObjectURL(f)});}inp.value='';draw();save()};
  draw();return box;
}

/* ---------- rooms & items ---------- */
function renderAll(){
  $('#hdr').replaceChildren(fieldsBlock(HDR,O.header,save,'h','grid'));
  $('#rooms').replaceChildren(...O.rooms.map(roomEl));
  $('#genNotes').value=O.notes||'';
  $('#genPhotos').replaceWith(Object.assign(photoBox(O.photos,'שרטוט / תמונה כללית'),{id:'genPhotos'}));
  sum();
}
function roomEl(r){
  const body=h('div',{class:'rb'});
  const name=h('input',{type:'text',value:r.name,'aria-label':'שם החדר',id:'rn-'+r.id});name.oninput=()=>{r.name=name.value;save()};
  const del=h('button',{class:'iconbtn',type:'button'},'הסרת חדר');del.onclick=()=>{if(r.items.length&&del.dataset.sure!=='1'){del.dataset.sure='1';del.textContent='ללחוץ שוב להסרה';return}O.rooms=O.rooms.filter(x=>x!==r);renderAll();save()};
  const items=h('div',{class:'list'},...r.items.map(it=>itemEl(r,it)));
  const add=h('div',{class:'addgrid'},...Object.entries(TYPES).map(([k,t])=>{const b=h('button',{type:'button',html:t.ic+`<span>${t.he}</span>`});b.onclick=()=>{const it={id:nid('i'),type:k,qty:1,v:{},note:'',photos:[]};r.items.push(it);items.append(itemEl(r,it));save();items.lastChild.scrollIntoView({behavior:'smooth',block:'start'})};return b}));
  body.append(items,h('div',{class:'lbl'},'הוספת פריט לחדר:'),add);
  return h('div',{class:'room'},h('div',{class:'rh'},name,del),body);
}
function itemEl(r,it){
  const t=TYPES[it.type],pv=h('div',{class:'preview'}),upd=()=>{pv.textContent=itemLines(it).map(l=>`${l.q}× ${l.d}`).join('\n');save()};
  const q=h('output',{},it.qty),minus=h('button',{type:'button','aria-label':'פחות'},'−'),plus=h('button',{type:'button','aria-label':'יותר'},'+');
  minus.onclick=()=>{it.qty=Math.max(1,it.qty-1);q.value=it.qty;upd()};plus.onclick=()=>{it.qty++;q.value=it.qty;upd()};
  const rm=h('button',{class:'iconbtn',type:'button'},'הסרה');
  const el=h('div',{class:'item'},h('div',{class:'ih'},h('strong',{html:t.ic+t.he}),h('div',{class:'qty'},minus,q,plus,rm)));
  rm.onclick=()=>{r.items=r.items.filter(x=>x!==it);el.remove();save()};
  t.groups.forEach(([g,fs],i)=>el.append(h('div',{class:i?'sub':''},i?h('div',{class:'lbl'},g):null,fieldsBlock(fs,it.v,upd,it.id))));
  const note=h('input',{type:'text',id:it.id+'-note',placeholder:'הערה לשורה (למשל: לפי שרטוט, קודם מגירות ואז דלת)'});note.value=it.note||'';note.oninput=()=>{it.note=note.value;upd()};
  el.append(h('div',{class:'f wide'},h('label',{class:'lbl',for:it.id+'-note'},'הערה'),note),photoBox(it.photos),pv);upd();return el;
}
function sum(){const n=O.rooms.reduce((a,r)=>a+r.items.length,0);$('#sum').innerHTML=n?`<b>${O.rooms.length}</b> חדרים · <b>${n}</b> פריטים`+(O.header.customer?` · ${esc(O.header.customer)}`:''):'אין פריטים עדיין'}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#addRoom').onclick=()=>{O.rooms.push({id:nid('r'),name:'חדר '+(O.rooms.length+1),items:[]});renderAll();save()};
$('#genNotes').oninput=e=>{O.notes=e.target.value;save()};

/* ---------- status line ---------- */
let stEl;function status(msg,kind='ok'){if(!stEl){stEl=h('div',{class:'status',role:'status'});$('#view-new').prepend(stEl)}stEl.className='status '+kind;stEl.textContent=msg}

/* ---------- send: through the hidden Elementor form on this page (saved under Elementor > Submissions) ---------- */
function boot(){renderAll()}
function payload(){
  const rooms=O.rooms.map(r=>({name:r.name,items:r.items.map(it=>({type:it.type,typeHe:TYPES[it.type].he,qty:it.qty,v:it.v,note:it.note,photos:it.photos.map(p=>p.name),lines:itemLines(it)}))})).filter(r=>r.items.length);
  const lines=rooms.flatMap(r=>[{d:`${r.name}-----------`,q:1},...r.items.flatMap(i=>i.lines)]);
  return {formVersion:1,sentAt:new Date().toISOString(),header:O.header,notes:O.notes,photos:O.photos.map(p=>p.name),rooms,lines};
}
$('#sendBtn').onclick=async()=>{
  const p=payload();
  if(!p.rooms.length){status('אין עדיין פריטים בטופס. הוסיפו חדר ופריט ואז שלחו.','warn');return}
  if(!p.header.customer){status('חסר שם לקוח בראש הטופס.','warn');document.getElementById('h-customer')?.focus();return}
  const form=document.querySelector('.mdy-hidden-form form');
  if(!form){status('הטופס לא מוכן לשליחה. רעננו את הדף.','err');return}
  const set=(n,v)=>{const el=form.querySelector(`[name="form_fields[${n}]"]`);if(el)el.value=v};
  set('customer',p.header.customer);set('measured_by',p.header.measuredBy||'');
  set('summary',p.lines.map(l=>`${l.q}× ${l.d}`).join('\n'));set('payload',JSON.stringify(p));
  const fi=form.querySelector('input[type=file]');const names=[...p.photos,...p.rooms.flatMap(r=>r.items.flatMap(i=>i.photos))].filter(n=>FILES.has(n));
  if(fi){const dt=new DataTransfer();names.forEach(n=>dt.items.add(FILES.get(n)));fi.files=dt.files}
  const btn=$('#sendBtn');btn.disabled=true;btn.textContent='שולח…';
  const done=(ok,msg)=>{btn.disabled=false;btn.textContent='שליחה למודולרי';if(ok){status(`ההזמנה של ${p.header.customer} נשלחה${names.length?` עם ${names.length} תמונות`:''}. אופק יקבל אותה ויכין הצעת מחיר והזמנה לספק.`,'ok');O=blank();FILES.clear();try{localStorage.removeItem('mdy-order-draft')}catch(e){};renderAll();scrollTo({top:0,behavior:'smooth'})}else status(msg||'השליחה לא הצליחה. הטיוטה נשמרה. בדקו קליטה ונסו שוב.','err')};
  const $f=window.jQuery&&jQuery(form);
  if($f){$f.off('.mdy');$f.one('submit_success.mdy',()=>done(true));$f.one('error.mdy',()=>done(false));}
  const t=setTimeout(()=>{const m=form.querySelector('.elementor-message');if(m&&/success/.test(m.className))done(true);else if(m)done(false,m.textContent.trim());else done(false,'אין תשובה מהשרת. נסו שוב.')},45000);
  if($f)$f.one('submit_success.mdy error.mdy',()=>clearTimeout(t));
  form.querySelector('[type=submit]').click();
};
$('#clearBtn').onclick=e=>{const b=e.currentTarget;if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='למחוק את הטיוטה?';setTimeout(()=>{b.dataset.sure='';b.textContent='טופס חדש'},3000);return}O=blank();FILES.clear();try{localStorage.removeItem('mdy-order-draft')}catch(e){};renderAll();b.dataset.sure='';b.textContent='טופס חדש'};
document.body.append(h('datalist',{id:'colors'},...COLORS.map(c=>h('option',{value:c}))));
boot();
</script>
