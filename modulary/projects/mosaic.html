<div class="mpm" data-mpm>
 <div class="mpm__grid">
  <button type="button" class="mpm__t mpm__t--a" data-pool="wide"></button>
  <button type="button" class="mpm__t mpm__t--b" data-pool="tall"></button>
  <button type="button" class="mpm__t mpm__t--c" data-pool="wide"></button>
  <button type="button" class="mpm__t mpm__t--d" data-pool="wide"></button>
  <button type="button" class="mpm__t mpm__t--e" data-pool="wide"></button>
  <button type="button" class="mpm__t mpm__t--f" data-pool="wide"></button>
  <button type="button" class="mpm__t mpm__t--g" data-pool="wide"></button>
 </div>
 <div class="mpm__bar">
  <p class="mpm__hint"><span class="mpm__n"></span> תמונות מפרויקטים שלנו · לחצו על תמונה כדי לראות אותה בגדול</p>

 </div>
 <dialog class="mpm__dlg" aria-label="תמונות מפרויקטים">
  <figure class="mpm__fig"><img alt=""><figcaption><span class="mpm__cap"></span><span class="mpm__cnt"></span></figcaption></figure>

  <button type="button" class="mpm__nav mpm__prev" aria-label="התמונה הקודמת">‹</button>

</div>
<style>

.mpm__t:focus-visible{outline:3px solid var(--y);outline-offset:3px}
.mpm__bar{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap;margin-top:14px}
.mpm__hint{margin:0;font-size:14px;color:var(--mut)}
.mpm__pp{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--mod-line,#D8D2C6);border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s}
.mpm__pp:hover{background:var(--cr)}
.mpm__pp:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.mpm__pp svg{width:16px;height:16px;fill:currentColor}

.mpm__dlg{width:min(1180px,94vw);max-width:none;max-height:92vh;padding:0;border:0;border-radius:10px;background:#111;color:#fff;overflow:hidden}
.mpm__dlg::backdrop{background:rgba(17,17,17,.82)}
.mpm__dlg[open]{animation:mpmIn .3s cubic-bezier(.2,.7,.2,1)}
@keyframes mpmIn{from{opacity:0;transform:scale(.97)}}
.mpm__fig{margin:0;display:flex;flex-direction:column}
.mpm__fig img{display:block;width:100%;max-height:calc(92vh - 56px);object-fit:contain;background:#111}
.mpm__fig figcaption{display:flex;justify-content:space-between;gap:16px;padding:14px 18px;font-size:15px;line-height:1.4;direction:rtl}
.mpm__cnt{color:#b9b4ab;white-space:nowrap}
.mpm__x,.mpm__nav{position:absolute;display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;background:rgba(17,17,17,.62);color:#fff;font-size:30px;line-height:1;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mpm__x{top:10px;left:10px}
.mpm__nav{top:calc(50% - 52px)}
.mpm__prev{right:10px}.mpm__next{left:10px}
.mpm__x:focus-visible,.mpm__nav:focus-visible{outline:3px solid var(--y);outline-offset:2px}
@media (max-width:767px){
 .mpm__grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(5,clamp(120px,34vw,190px));grid-template-areas:"a a" "b c" "b d" "f f" "e g"}
}
@media (prefers-reduced-motion:reduce){.mpm__t img{transition:none!important;transform:none!important}.mpm__dlg[open]{animation:none}}
</style>
