<!-- live mosaic (16.11.2026): seven tiles that change one at a time from the project photos; hover, focus or the pause button stops them; a click opens the photo large. Reduced motion: still. To undo: restore the widget backup. -->
<div class="mpm" data-mpm>
 <div class="mpm__grid">
  <button type="button" class="mpm__t mpm__t--a" data-pool="wide"></button>
  <button type="button" class="mpm__t mpm__t--b" data-pool="tall"></button>
  <button type="button" class="mpm__t mpm__t--c" data-pool="wide"></button>
  <button type="button" class="mpm__t mpm__t--d" data-pool="wide"></button>
  <button type="button" class="mpm__t mpm__t--e" data-pool="wide"></button>
  <button type="button" class="mpm__t mpm__t--f" data-pool="wide"></button>
  <button type="button" class="mpm__t mpm__t--g" data-pool="wide"></button>
 </div>
 <div class="mpm__bar">
  <p class="mpm__hint"><span class="mpm__n"></span> תמונות מפרויקטים שלנו · לחצו על תמונה כדי לראות אותה בגדול</p>
  <button type="button" class="mpm__pp" aria-pressed="false"><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg><span>עצירת התמונות</span></button>
 </div>
 <dialog class="mpm__dlg" aria-label="תמונות מפרויקטים">
  <figure class="mpm__fig"><img alt=""><figcaption><span class="mpm__cap"></span><span class="mpm__cnt"></span></figcaption></figure>
  <button type="button" class="mpm__x" aria-label="סגירה">×</button>
  <button type="button" class="mpm__nav mpm__prev" aria-label="התמונה הקודמת">›</button>
  <button type="button" class="mpm__nav mpm__next" aria-label="התמונה הבאה">‹</button>
 </dialog>
</div>
<style>
.mpm{--ink:var(--mod-ink,#1C1C1A);--y:var(--mod-accent,#F8DC55);--cr:var(--mod-cream,#F3EEE5);--mut:var(--mod-muted,#6F6A62)}
.mpm__grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,clamp(140px,16vw,230px));grid-template-areas:"a a b c" "a a b d" "e f f g";gap:clamp(8px,1vw,14px)}
.mpm__t{position:relative;display:block;padding:0;border:0;margin:0;overflow:hidden;border-radius:var(--mod-r,2px);background:var(--cr);cursor:zoom-in;font:inherit}
.mpm__t--a{grid-area:a}.mpm__t--b{grid-area:b}.mpm__t--c{grid-area:c}.mpm__t--d{grid-area:d}.mpm__t--e{grid-area:e}.mpm__t--f{grid-area:f}.mpm__t--g{grid-area:g}
.mpm__t img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity 1.1s cubic-bezier(.2,.7,.2,1),transform 6s cubic-bezier(.2,.7,.2,1)}
.mpm__t img.is-new{opacity:0;transform:scale(1.06)}
.mpm__t img.is-old{opacity:0}
.mpm__t:hover img:not(.is-new),.mpm__t:focus-visible img:not(.is-new){transform:scale(1.03)}
.mpm__t:focus-visible{outline:3px solid var(--y);outline-offset:3px}
.mpm__bar{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap;margin-top:14px}
.mpm__hint{margin:0;font-size:14px;color:var(--mut)}
.mpm__pp{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--mod-line,#D8D2C6);border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s}
.mpm__pp:hover{background:var(--cr)}
.mpm__pp:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.mpm__pp svg{width:16px;height:16px;fill:currentColor}
.mpm__pp .i-play,.mpm.is-held .mpm__pp .i-pause{display:none}.mpm.is-held .mpm__pp .i-play{display:block}
.mpm__dlg{width:min(1180px,94vw);max-width:none;max-height:92vh;padding:0;border:0;border-radius:10px;background:#111;color:#fff;overflow:hidden}
.mpm__dlg::backdrop{background:rgba(17,17,17,.82)}
.mpm__dlg[open]{animation:mpmIn .3s cubic-bezier(.2,.7,.2,1)}
@keyframes mpmIn{from{opacity:0;transform:scale(.97)}}
.mpm__fig{margin:0;display:flex;flex-direction:column}
.mpm__fig img{display:block;width:100%;max-height:calc(92vh - 56px);object-fit:contain;background:#111}
.mpm__fig figcaption{display:flex;justify-content:space-between;gap:16px;padding:14px 18px;font-size:15px;line-height:1.4;direction:rtl}
.mpm__cnt{color:#b9b4ab;white-space:nowrap}
.mpm__x,.mpm__nav{position:absolute;display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;background:rgba(17,17,17,.62);color:#fff;font-size:30px;line-height:1;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mpm__x{top:10px;left:10px}
.mpm__nav{top:calc(50% - 52px)}
.mpm__prev{right:10px}.mpm__next{left:10px}
.mpm__x:focus-visible,.mpm__nav:focus-visible{outline:3px solid var(--y);outline-offset:2px}
@media (max-width:767px){
 .mpm__grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(5,clamp(120px,34vw,190px));grid-template-areas:"a a" "b c" "b d" "f f" "e g"}
}
.mpm .mpm__t,.mpm .mpm__t:hover,.mpm .mpm__t:focus{background:var(--cr)!important;color:inherit!important;border:0!important;box-shadow:none!important}
.mpm .mpm__pp,.mpm .mpm__pp:focus{background:transparent!important;color:var(--ink)!important;border:1px solid var(--mod-line,#D8D2C6)!important}.mpm .mpm__pp:hover{background:var(--cr)!important}
.mpm .mpm__x,.mpm .mpm__nav,.mpm .mpm__x:hover,.mpm .mpm__nav:hover,.mpm .mpm__x:focus,.mpm .mpm__nav:focus{background:rgba(17,17,17,.62)!important;color:#fff!important;border:0!important;padding:0!important}
.mpm .mpm__x:hover,.mpm .mpm__nav:hover{background:rgba(17,17,17,.85)!important}
@media (prefers-reduced-motion:reduce){.mpm__t img{transition:none!important;transform:none!important}.mpm__dlg[open]{animation:none}}
</style>
<script>
(function(){
var root=document.querySelector('[data-mpm]'); if(!root||root.dataset.on) return; root.dataset.on=1;
var D=@DATA@, B=D.base, all=D.wide.concat(D.tall);
var tiles=[].slice.call(root.querySelectorAll('.mpm__t')), pp=root.querySelector('.mpm__pp'), ppl=pp.querySelector('span');
root.querySelector('.mpm__n').textContent=all.length;
var queue={wide:D.wide.map(function(_,i){return i}),tall:D.tall.map(function(_,i){return i})};
var shown={}, cur=[];
function src(p,size){ var s=B+p[0]; if(size&&/-\d+x\d+\./.test(s)===false&&/\.webp$/.test(s)) return s; return s; }
function next(pool){ var q=queue[pool], list=D[pool]; for(var k=0;k<q.length;k++){ var i=q[k]; if(!shown[pool+i]){ q.splice(k,1); q.push(i); return i; } } return q[0]; }
function img(p,eager){ var im=new Image(); im.src=B+p[0]; im.width=p[1]; im.height=p[2]; im.alt=p[3]; im.decoding='async'; if(!eager) im.loading='lazy'; return im; }
tiles.forEach(function(t,ti){ var pool=t.dataset.pool, i=next(pool); shown[pool+i]=1; cur[ti]=[pool,i]; var im=img(D[pool][i],ti===0); t.appendChild(im); t.setAttribute('aria-label','הגדלת התמונה: '+D[pool][i][3]); });
/* rotation: one tile at a time, never the one under the pointer or focus */
var calm=matchMedia('(prefers-reduced-motion: reduce)').matches, held=calm, inView=false, over=false, last=-1, timer=null;
function swap(){
  var cand=tiles.map(function(_,i){return i}).filter(function(i){return i!==last && !tiles[i].matches(':hover') && tiles[i]!==document.activeElement});
  if(!cand.length) return; var ti=cand[Math.floor(Math.random()*cand.length)], t=tiles[ti], pool=t.dataset.pool;
  var i=next(pool), p=D[pool][i], im=img(p,true); im.classList.add('is-new');
  var go=function(){ var old=t.querySelector('img:not(.is-new)'); t.appendChild(im); requestAnimationFrame(function(){ requestAnimationFrame(function(){ im.classList.remove('is-new'); if(old) old.classList.add('is-old'); }); });
    setTimeout(function(){ if(old&&old.parentNode) old.parentNode.removeChild(old); },1300);
    delete shown[cur[ti][0]+cur[ti][1]]; shown[pool+i]=1; cur[ti]=[pool,i]; last=ti; t.setAttribute('aria-label','הגדלת התמונה: '+p[3]); };
  if(im.complete) go(); else { im.onload=go; im.onerror=function(){}; }
}
function run(){ stop(); if(!held && inView && !over && !document.hidden) timer=setInterval(swap,3200); }
function stop(){ if(timer){ clearInterval(timer); timer=null; } }
function ui(){ root.classList.toggle('is-held',held); pp.setAttribute('aria-pressed',held?'true':'false'); ppl.textContent=held?'הפעלת התמונות':'עצירת התמונות'; }
pp.addEventListener('click',function(){ held=!held; ui(); run(); });
var grid=root.querySelector('.mpm__grid');
grid.addEventListener('pointerenter',function(){ over=true; stop(); }); grid.addEventListener('pointerleave',function(){ over=false; run(); });
grid.addEventListener('focusin',function(){ over=true; stop(); }); grid.addEventListener('focusout',function(){ over=false; run(); });
document.addEventListener('visibilitychange',run);
if('IntersectionObserver' in window) new IntersectionObserver(function(es){ es.forEach(function(e){ inView=e.isIntersecting; run(); }); },{threshold:.3}).observe(grid);
ui();
/* large view: every photo, arrows, swipe, Esc */
var dlg=root.querySelector('.mpm__dlg'), dimg=dlg.querySelector('img'), cap=dlg.querySelector('.mpm__cap'), cnt=dlg.querySelector('.mpm__cnt'), at=0, opener=null;
function show(k){ at=(k+all.length)%all.length; var p=all[at]; dimg.src=B+p[0]; dimg.alt=p[3]; cap.textContent=p[3]; cnt.textContent=(at+1)+' / '+all.length; var n=all[(at+1)%all.length]; (new Image()).src=B+n[0]; }
function open(k){ opener=document.activeElement; show(k); if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open',''); held=true; ui(); stop(); }
tiles.forEach(function(t,ti){ t.addEventListener('click',function(){ var c=cur[ti]; open(c[0]==='wide'?c[1]:D.wide.length+c[1]); }); });
dlg.querySelector('.mpm__x').addEventListener('click',function(){ dlg.close(); });
dlg.querySelector('.mpm__prev').addEventListener('click',function(){ show(at-1); });
dlg.querySelector('.mpm__next').addEventListener('click',function(){ show(at+1); });
dlg.addEventListener('keydown',function(e){ if(e.key==='ArrowRight') show(at-1); else if(e.key==='ArrowLeft') show(at+1); });
dlg.addEventListener('click',function(e){ if(e.target===dlg) dlg.close(); });
dlg.addEventListener('close',function(){ held=calm; ui(); run(); if(opener&&opener.focus) opener.focus(); });
var x0=null; dimg.addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; },{passive:true});
dimg.addEventListener('touchend',function(e){ if(x0===null) return; var dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>40) show(at+(dx>0?1:-1)); x0=null; });
})();
</script>
