<section class="mpl" dir="rtl" aria-labelledby="mpl-h">
<div class="mpl-in">
  <div class="mpl-txt">
    <p class="mpl-k">לאנשי מקצוע</p>
    <h2 id="mpl-h">מתכננים חלל? אנחנו כבר בתוך התוכנית.</h2>
    <p class="mpl-p">אדריכלים, מעצבים, מנהלי רכש ויזמים מקבלים מאיתנו ליווי בבחירת מוצרים, התאמת מידות, צבעים וחומרים, תמחור כמויות ושילוב ריהוט בהתאמה אישית.</p>
    <a class="mpl-btn" href="/צור-קשר/?subject=%D7%94%D7%AA%D7%90%D7%9E%D7%AA%20%D7%A8%D7%99%D7%94%D7%95%D7%98%20%D7%9C%D7%A4%D7%A8%D7%95%D7%99%D7%A7%D7%98">דברו איתנו על הפרויקט</a>
  </div>
  <div class="mpl-slot"></div>
</div>
</section>
<style>
.mpl{background:#1C1C1A;background-image:linear-gradient(rgba(243,238,229,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(243,238,229,.045) 1px,transparent 1px);background-size:32px 32px;color:#fff;padding:72px 24px;margin:0}
.mpl-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:56px}
.mpl-txt{flex:0 1 520px;max-width:520px}
.mpl-slot{flex:1 1 0;min-width:0}
.mpl-k{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.18em;color:#F8DC55}
.mpl h2{margin:0 0 14px;font-size:clamp(30px,3.6vw,52px);line-height:1.12;font-weight:800;color:#fff}
.mpl-p{margin:0;font-size:17px;line-height:1.65;color:rgba(255,255,255,.86)}
.mpl-btn{display:inline-block;margin-top:28px;padding:15px 30px;border:1.5px solid #fff;color:#fff!important;text-decoration:none!important;font-weight:600;letter-spacing:.06em;transition:background .2s,color .2s,border-color .2s}
.mpl-btn:hover,.mpl-btn:focus-visible{background:#F8DC55;border-color:#F8DC55;color:#1C1C1A!important}
.mpl-btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (max-width:1024px){.mpl-in{gap:28px}.mpl-txt{flex-basis:380px}}
@media (max-width:767px){.mpl{padding:48px 20px 56px}.mpl-in{flex-direction:column-reverse;align-items:stretch;gap:20px}.mpl-txt{max-width:none;flex-basis:auto}}
.mpl .mr-plan{flex:1 1 520px;min-width:0;padding:24px 0}
.mpl .mr-plan svg{display:block;width:100%;height:auto;overflow:visible}
.mpl .mr-plan .w{fill:none;stroke:#F3EEE5;stroke-width:6;stroke-linecap:square;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.4s cubic-bezier(.6,0,.2,1)}
.mpl .mr-plan .p{fill:none;stroke:#F3EEE5;stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1s cubic-bezier(.6,0,.2,1) .5s}
.mpl .mr-plan .z{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.6);transition:opacity .5s,transform .6s cubic-bezier(.3,1.5,.5,1)}
.mpl .mr-plan .f{stroke:#F3EEE5;stroke-width:2;stroke-linejoin:round}
.mpl .mr-plan .d{stroke:#F8DC55;stroke-width:1.6;fill:none;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .8s ease 2.6s}
.mpl .mr-plan .t{font:600 11px/1 Assistant,Arial,sans-serif;letter-spacing:.2em;fill:rgba(243,238,229,.55);opacity:0;transition:opacity .8s 2.4s}
.mpl .mr-plan .n{font:600 11px/1 Assistant,Arial,sans-serif;fill:#F8DC55;opacity:0;transition:opacity .6s 3s}
.mpl .mr-plan .scan{opacity:0}
.mpl .mr-plan.mr-in .w,.mpl .mr-plan.mr-in .p,.mpl .mr-plan.mr-in .d{stroke-dashoffset:0}
.mpl .mr-plan.mr-in .z{opacity:1;transform:none}
.mpl .mr-plan.mr-in .t,.mpl .mr-plan.mr-in .n{opacity:1}
.mpl .mr-plan.mr-in .scan{animation:mrScan 6s ease-in-out 3.4s infinite}
@keyframes mrScan{0%{opacity:0;transform:translateX(0)}10%{opacity:.55}90%{opacity:.55}100%{opacity:0;transform:translateX(600px)}}
.mpl .mr-plan{padding:0}
@media (prefers-reduced-motion:reduce){.mpl .mr-plan *{transition:none!important;animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}.mpl .mr-plan .scan{opacity:0!important}}
html.a11y-still .mpl .mr-plan *{transition:none!important;animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}
</style>
<script>
(function(){
  var Y='#F8DC55',C='#F3EEE5';
  function plan(){
    var G='#3E7457',G2='#79A98B',S='#E7E2D9',o='';
    function z(x,y,inner,dl){return '<g class="z" style="transition-delay:'+dl+'s">'+inner+'</g>';}
    function rect(x,y,w,h,f,r){return '<rect class="f" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(r||3)+'" fill="'+f+'"/>';}
    function circ(x,y,r,f){return '<circle class="f" cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+f+'"/>';}
    function chair(x,y){return circ(x,y,7,S);}
    function plant(x,y,r){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+G+'"/><circle cx="'+(x-r*.3)+'" cy="'+(y-r*.3)+'" r="'+(r*.55)+'" fill="'+G2+'"/>';}
    // walls (outer + partitions, with door gaps)
    o+='<path class="w" pathLength="1" d="M20 20H330M370 20H620V420H400M360 420H20V20"/>';
    o+='<path class="p" pathLength="1" d="M20 190H150M190 190H250V20M250 260V420M420 20V150M420 190V260H520M560 260H620"/>';
    // meeting room
    var m=rect(60,70,150,44,Y,4);for(var i=0;i<6;i++){m+=chair(72+i*25,58)+chair(72+i*25,126);}m+=chair(48,92)+chair(222,92);
    o+=z(0,0,m,1.0);
    // open space: desk clusters
    var d='';[[268,60],[268,150],[352,60],[352,150]].forEach(function(p){d+=rect(p[0],p[1],48,30,C)+rect(p[0],p[1]+30,48,30,C)+chair(p[0]-10,p[1]+15)+chair(p[0]-10,p[1]+45)+chair(p[0]+58,p[1]+15)+chair(p[0]+58,p[1]+45)+'<rect x="'+(p[0]+4)+'" y="'+(p[1]+4)+'" width="16" height="6" fill="'+Y+'"/>'+'<rect x="'+(p[0]+4)+'" y="'+(p[1]+50)+'" width="16" height="6" fill="'+Y+'"/>';});
    o+=z(0,0,d,1.25);
    // phone pods (round, like the office in the photo)
    var pp='';[[470,60],[560,60]].forEach(function(p){pp+=circ(p[0],p[1]+30,30,'rgba(248,220,85,.18)')+circ(p[0],p[1]+30,10,Y);});o+=z(0,0,pp,1.5);
    // café: round tables
    var c='';[[70,250],[150,250],[70,340],[150,340],[210,300]].forEach(function(p,k){c+=circ(p[0],p[1],17,Y)+chair(p[0]-26,p[1])+chair(p[0]+26,p[1])+chair(p[0],p[1]-26);});
    o+=z(0,0,c,1.55);
    // lounge: rug, L-sofa, armchairs, coffee table
    var l='<rect x="300" y="300" width="190" height="96" rx="6" fill="rgba(248,220,85,.22)" stroke="'+Y+'" stroke-width="2" stroke-dasharray="6 5"/>';
    l+='<path class="f" d="M290 290H500V318H318V410H290Z" fill="'+S+'"/>'+rect(372,336,64,32,'#6A4832',4)+rect(458,340,30,30,Y,6)+rect(458,376,30,30,Y,6);
    o+=z(0,0,l,1.85);
    // reception / kitchen
    var k='<path class="f" d="M540 300H600V400H572V328H540Z" fill="'+C+'"/>'+chair(526,350)+chair(526,380);o+=z(0,0,k,2.05);
    // plants
    o+=z(0,0,plant(232,40,13)+plant(600,170,14)+plant(40,400,12)+plant(260,404,11)+plant(400,170,10),2.2);
    // labels + dimensions
    o+='<text class="t" x="60" y="160">MEETING</text><text class="t" x="290" y="246">OPEN SPACE</text><text class="t" x="462" y="140">PODS</text><text class="t" x="40" y="214">CAFÉ</text><text class="t" x="300" y="280">LOUNGE</text>';
    o+='<path class="d" pathLength="1" d="M20 446H620M20 440V452M620 440V452M646 20V420M640 20H652M640 420H652"/>';
    o+='<text class="n" x="300" y="466">16.00</text><text class="n" x="656" y="224">10.50</text>';
    o+='<rect class="scan" x="18" y="18" width="2" height="404" fill="'+Y+'"/>';
    return '<div class="mr-plan" aria-hidden="true"><svg viewBox="0 0 680 480" style="direction:ltr">'+o+'</svg></div>';
  }
  document.querySelectorAll('.mpl .mpl-slot').forEach(function(s){
    if(s.querySelector('.mr-plan'))return; s.innerHTML=plan(); var el=s.querySelector('.mr-plan');
    if(!('IntersectionObserver' in window)){el.classList.add('mr-in');return;}
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('mr-in');io.unobserve(e.target);}});},{threshold:0.25}); io.observe(el);
  });
})();
</script>
