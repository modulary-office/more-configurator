<style>
.mdf{--y:#F8DC55;--ink:#1C1C1A;--paper:#F4F2ED;direction:rtl}
.mdf-video{position:relative;width:100%;aspect-ratio:16/9;background:var(--paper);overflow:hidden;line-height:0}
.mdf-v{display:block;width:100%;height:100%;object-fit:cover;background:var(--paper)}
@media (max-width:767px){.mdf-video{aspect-ratio:9/16;max-height:calc(100svh - 70px)}}
.mdf .mdf-btn{position:absolute!important;bottom:16px!important;top:auto!important;width:46px!important;height:46px!important;min-width:0!important;min-height:0!important;padding:0!important;margin:0!important;border-radius:50%!important;border:1.5px solid var(--ink)!important;background:rgba(244,242,237,.92)!important;color:var(--ink)!important;display:grid!important;place-items:center;cursor:pointer;z-index:2;box-shadow:0 4px 14px rgba(28,28,26,.12)!important;transition:background .2s,transform .2s;line-height:0!important}
.mdf .mdf-sound{left:16px!important;right:auto!important}.mdf .mdf-pause{left:70px!important;right:auto!important}
.mdf .mdf-btn:hover,.mdf .mdf-btn:focus-visible{background:var(--y)!important;transform:scale(1.06)}
.mdf .mdf-btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.mdf .mdf-btn svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mdf .mdf-btn .f,.mdf .i-pl{fill:var(--ink)}
.mdf .i-on,.mdf .mdf-sound.on .i-off,.mdf .i-pl,.mdf .mdf-pause.paused .i-pa{display:none}
.mdf .mdf-sound.on .i-on,.mdf .mdf-pause.paused .i-pl{display:block}
/* category strip */
.mdf-cats{background:#fff;border-bottom:1px solid #e8e4dc}
.mdf-cats ul{list-style:none;margin:0 auto;padding:18px 24px;max-width:1400px;display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.mdf-cats li{margin:0;padding:0}
.mdf-cats a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border-radius:14px;text-decoration:none!important;color:var(--ink)!important;text-align:center;font-size:14px;font-weight:600;line-height:1.25;transition:background .2s,transform .2s}
.mdf-cats svg{width:44px;height:44px;flex:none;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.mdf-cats a:hover,.mdf-cats a:focus-visible{background:#FBF7E6}
.mdf-cats a:hover svg,.mdf-cats a:focus-visible svg{transform:translateY(-3px) scale(1.08)}
.mdf-cats a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (max-width:1100px){.mdf-cats ul{grid-template-columns:repeat(5,1fr)}}
@media (max-width:767px){
  .mdf-cats ul{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:4px;padding:14px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .mdf-cats ul::-webkit-scrollbar{display:none}
  .mdf-cats li{flex:0 0 27%;scroll-snap-align:start}
  .mdf-cats a{font-size:13px;padding:10px 4px}.mdf-cats svg{width:38px;height:38px}
}
@media (prefers-reduced-motion:reduce){.mdf-cats svg,.mdf-cats a{transition:none}}
</style>
<script>
(function(){
  var root=document.querySelector('[data-mdf]'); if(!root) return;
  var v=root.querySelector('video'), bS=root.querySelector('.mdf-sound'), bP=root.querySelector('.mdf-pause');
  var SRC={wide:'__WIDE__',tall:'__TALL__',posterWide:'__PW__',posterTall:'__PT__'};
  var mq=matchMedia('(max-width:767px)'), tall=mq.matches;
  v.muted=true; v.defaultMuted=true; v.setAttribute('muted','');
  v.poster=tall?SRC.posterTall:SRC.posterWide; v.src=tall?SRC.tall:SRC.wide;
  var still=function(){ return !!window.MR_STILL || matchMedia('(prefers-reduced-motion: reduce)').matches; };
  var visible=false, userPaused=false, forced=false, loopT=0;
  function setPaused(p){ bP.classList.toggle('paused',p); bP.setAttribute('aria-pressed',String(p)); bP.setAttribute('aria-label',p?'הפעלת הסרטון':'עצירת הסרטון'); }
  function play(){ if(userPaused||(still()&&!forced)||!visible) return; var p=v.play(); if(p&&p.catch) p.catch(function(){}); }
  setPaused(still());
  if(still()) v.preload='none';
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){ es.forEach(function(e){ visible=e.intersectionRatio>=0.35; if(visible){ v.preload='auto'; play(); } else v.pause(); }); },{threshold:[0,.35,.6]}).observe(root.querySelector('.mdf-video'));
  } else { visible=true; play(); }
  /* at the end the logo holds for 3 s, then the film plays again (only while on screen) */
  v.addEventListener('ended',function(){ clearTimeout(loopT); loopT=setTimeout(function(){ v.currentTime=0; play(); },3000); });
  bP.addEventListener('click',function(){ if(!v.paused){ userPaused=true; v.pause(); setPaused(true); } else { userPaused=false; forced=true; setPaused(false); play(); } });
  bS.addEventListener('click',function(){ v.muted=!v.muted; bS.classList.toggle('on',!v.muted); bS.setAttribute('aria-pressed',String(!v.muted)); bS.setAttribute('aria-label',v.muted?'הפעלת סאונד':'השתקה'); if(!v.muted){ if(v.currentTime>2) v.currentTime=0; userPaused=false; forced=true; setPaused(false); play(); } });
  document.addEventListener('mr-a11y',function(){ if(still()){ forced=false; v.pause(); setPaused(true); } });
})();
</script>
