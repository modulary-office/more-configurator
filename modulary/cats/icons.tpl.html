<!-- chair categories as animated line icons, transparent background (16.11.2026). Replaces the four photo tiles (kept hidden, not deleted). To undo: delete this widget and un-hide the old tiles section. -->
<nav class="mci" aria-label="סוגי כיסאות">
<style>
.mci{--ink:var(--mod-ink,#1C1C1A);--y:var(--mod-accent,#F8DC55);direction:rtl;max-width:1120px;margin:0 auto;padding:8px 16px 24px;font-family:var(--mod-font,Heebo,Arial,sans-serif)}
.mci ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:800px){.mci ul{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}}
.mci a{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 10px 20px;border-radius:18px;background:transparent;color:var(--ink)!important;text-decoration:none!important;text-align:center;transition:transform .12s ease-out,background .25s ease}

.mci a:active{transform:scale(.97)}
.mci a:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.mci svg{width:clamp(84px,9vw,112px);height:auto;overflow:visible;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mci .f{fill:var(--y)}
.mci b{font-size:clamp(17px,1.5vw,21px);font-weight:700;line-height:1.25;text-wrap:balance}
.mci b::after{content:"";display:block;width:0;height:4px;border-radius:2px;background:var(--y);margin:8px auto 0;transition:width .35s cubic-bezier(.2,.7,.2,1)}
.mci a:hover b::after,.mci a:focus-visible b::after{width:36px}
/* each icon has one moving part; it moves from where it is and comes back the same way */
.mci .mv{transform-box:fill-box;transition:transform .55s cubic-bezier(.2,.9,.25,1.15)}
.mci .i-bar .mv{transform-origin:50% 100%}.mci a:hover .i-bar .mv,.mci a:focus-visible .i-bar .mv{transform:rotate(-14deg)}
.mci .i-guest .mv{transform-origin:50% 100%}.mci a:hover .i-guest .mv,.mci a:focus-visible .i-guest .mv{transform:rotate(7deg)}
.mci .i-mgr .mv{transform-origin:20% 100%}.mci a:hover .i-mgr .mv,.mci a:focus-visible .i-mgr .mv{transform:rotate(-9deg)}
.mci .i-work .mv{transform-origin:50% 50%}.mci a:hover .i-work .mv,.mci a:focus-visible .i-work .mv{transform:translateX(-4px)}
/* drawn once when the row scrolls into view */
.mci.is-ready path,.mci.is-ready rect,.mci.is-ready circle,.mci.is-ready ellipse{stroke-dasharray:1;stroke-dashoffset:1}
.mci.is-ready .f{fill-opacity:0}
.mci.is-in path,.mci.is-in rect,.mci.is-in circle,.mci.is-in ellipse{stroke-dashoffset:0;transition:stroke-dashoffset .9s cubic-bezier(.3,.6,.2,1) var(--d,0ms)}
.mci.is-in .f{fill-opacity:1;transition:fill-opacity .5s ease calc(var(--d,0ms) + .45s),stroke-dashoffset .9s cubic-bezier(.3,.6,.2,1) var(--d,0ms)}
@media (prefers-reduced-motion:reduce){.mci .mv,.mci a,.mci b::after{transition:none}.mci a:hover .mv,.mci a:focus-visible .mv{transform:none}.mci a:active{transform:none}.mci.is-ready path,.mci.is-ready rect,.mci.is-ready circle,.mci.is-ready ellipse{stroke-dasharray:none;stroke-dashoffset:0}.mci.is-ready .f{fill-opacity:1}}
</style>

(function(){var n=document.currentScript.closest('.mci');if(!n||!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
