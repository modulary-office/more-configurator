<!-- 3D builder for this category (16.11.2026): only the product groups that belong on this page. To undo: delete this widget. -->
<section class="mb3d-sec" aria-labelledby="mb3d-sec-h">
<style>
.mb3d-sec{direction:rtl;max-width:1320px;margin:0 auto;padding:clamp(28px,5vw,60px) 0 clamp(16px,3vw,32px);font-family:var(--mod-font,Heebo,Arial,sans-serif);color:var(--mod-ink,#1C1C1A)}
.mb3d-sec-head{padding:0 16px;margin:0 0 clamp(14px,2vw,24px)}
.mb3d-sec-eye{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:0 0 10px}
.mb3d-sec-eye::before{content:"";width:28px;height:6px;border-radius:3px;background:var(--mod-accent,#F8DC55)}
.mb3d-sec h2{font-size:clamp(28px,4vw,46px);font-weight:800;line-height:1.08;letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.mb3d-sec-lead{font-size:clamp(16px,1.4vw,19px);line-height:1.65;color:#5f5b54;margin:0;max-width:52ch}
.mb3d-sec-exp{margin:clamp(16px,2.5vw,28px) 0 0;padding:clamp(16px,2vw,24px);border-inline-start:4px solid var(--mod-accent,#F8DC55);background:#F0ECE4;font-size:clamp(16px,1.35vw,18px);line-height:1.75;max-width:72ch}
.mb3d-sec-exp b{font-weight:700}
.mb3d-sec #mb3d{min-height:520px}
</style>
<div class="mb3d-sec-head"><p class="mb3d-sec-eye">בונים בתלת־ממד</p><h2 id="mb3d-sec-h">@TITLE@</h2><p class="mb3d-sec-lead">@LEAD@</p>@EXTRA@</div>
<link rel="stylesheet" href="@BASE@build3d.css">
<div id="mb3d" data-groups="@GROUPS@" data-default="@DEF@" data-title="off" data-lazy="1" data-quote="/צור-קשר/" data-brand="מודולרי"></div>
<script type="module" src="@BASE@build3d.js"></script>
</section>
